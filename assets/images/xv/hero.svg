<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_xv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0f3"/>
      <stop offset="50%" stop-color="#fde2e4"/>
      <stop offset="100%" stop-color="#ffcad4"/>
    </linearGradient>
    <linearGradient id="gold_xv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#fff2a3"/>
      <stop offset="100%" stop-color="#aa771c"/>
    </linearGradient>
    <linearGradient id="rose_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b5838d"/>
      <stop offset="100%" stop-color="#6d597a"/>
    </linearGradient>
    <filter id="glow_filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bg_xv)"/>

  <!-- Floral Arch Decor -->
  <g fill="none" stroke="url(#gold_xv)" stroke-width="2">
    <circle cx="400" cy="420" r="320"/>
    <circle cx="400" cy="420" r="305" stroke-dasharray="6,6"/>
    <rect x="120" y="120" width="560" height="760" rx="30" stroke-width="1.5"/>
  </g>

  <!-- Rose Petals & Ornaments -->
  <g fill="#e8b4b8" opacity="0.6">
    <path d="M180,220 C150,200 160,160 190,170 C220,180 200,230 180,220 Z"/>
    <path d="M620,240 C650,220 640,180 610,190 C580,200 600,250 620,240 Z"/>
    <path d="M200,750 C170,730 180,690 210,700 C240,710 220,760 200,750 Z"/>
    <path d="M600,760 C630,740 620,700 590,710 C560,720 580,770 600,760 Z"/>
  </g>

  <!-- Golden Crown -->
  <g filter="url(#glow_filter)">
    <path d="M350,280 L370,305 L400,255 L430,305 L450,280 L440,330 L360,330 Z" fill="url(#gold_xv)"/>
    <circle cx="350" cy="273" r="6" fill="url(#gold_xv)"/>
    <circle cx="400" cy="248" r="7" fill="url(#gold_xv)"/>
    <circle cx="450" cy="273" r="6" fill="url(#gold_xv)"/>
  </g>

  <!-- Portrait Silhouette Centerpiece -->
  <circle cx="400" cy="440" r="140" fill="#ffffff" opacity="0.9"/>
  <circle cx="400" cy="440" r="130" fill="none" stroke="url(#gold_xv)" stroke-width="3"/>
  <circle cx="400" cy="410" r="55" fill="#f8edeb"/>
  <path d="M330,530 C330,450 470,450 470,530 Z" fill="#e8b4b8" opacity="0.8"/>
  <path d="M350,400 Q400,340 450,400 Q430,450 400,440 Q370,450 350,400 Z" fill="url(#rose_grad)"/>

  <!-- Typography Representation -->
  <text x="400" y="660" font-family="'Great Vibes', cursive, serif" font-size="64" font-weight="bold" fill="url(#gold_xv)" text-anchor="middle" filter="url(#glow_filter)">Ana María</text>
  <text x="400" y="720" font-family="'Montserrat', sans-serif" font-size="22" letter-spacing="6" font-weight="600" fill="#6d597a" text-anchor="middle">MIS XV AÑOS</text>

  <!-- Sparkles -->
  <g fill="url(#gold_xv)">
    <path d="M220,280 L224,292 L236,296 L224,300 L220,312 L216,300 L204,296 L216,292 Z"/>
    <path d="M580,310 L584,322 L596,326 L584,330 L580,342 L576,330 L564,326 L576,322 Z"/>
    <path d="M240,720 L244,732 L256,736 L244,740 L240,752 L236,740 L224,736 L236,732 Z"/>
    <path d="M560,700 L564,712 L576,716 L564,720 L560,732 L556,720 L544,716 L556,712 Z"/>
  </g>
</svg>
