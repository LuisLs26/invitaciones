<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_cumple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a16"/>
      <stop offset="50%" stop-color="#18122b"/>
      <stop offset="100%" stop-color="#2d132c"/>
    </linearGradient>
    <linearGradient id="party_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff416c"/>
      <stop offset="100%" stop-color="#ff4b2b"/>
    </linearGradient>
    <linearGradient id="cyan_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="neon_glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bg_cumple)"/>

  <!-- Glowing Neon Circles & Particles -->
  <g opacity="0.6">
    <circle cx="200" cy="200" r="160" fill="#00f2fe" opacity="0.1" filter="url(#neon_glow)"/>
    <circle cx="600" cy="700" r="180" fill="#ff416c" opacity="0.1" filter="url(#neon_glow)"/>
    
    <!-- Confetti Pieces -->
    <rect x="180" y="150" width="16" height="16" fill="#ffb703" transform="rotate(25 180 150)"/>
    <rect x="580" y="180" width="22" height="22" fill="#ff416c" transform="rotate(45 580 180)"/>
    <circle cx="140" cy="700" r="12" fill="#00f2fe"/>
    <circle cx="680" cy="650" r="15" fill="#a855f7"/>
  </g>

  <!-- Frame -->
  <rect x="90" y="90" width="620" height="820" rx="24" fill="none" stroke="url(#cyan_grad)" stroke-width="3" filter="url(#neon_glow)"/>

  <!-- Cake Icon Container -->
  <circle cx="400" cy="380" r="140" fill="#ffffff" opacity="0.05"/>
  <circle cx="400" cy="380" r="130" fill="none" stroke="url(#party_grad)" stroke-width="3" stroke-dasharray="10,5"/>

  <!-- Birthday Cake Icon -->
  <g transform="translate(320, 290)">
    <rect x="72" y="10" width="16" height="40" rx="4" fill="#ffb703"/>
    <path d="M80,0 C85,6 83,10 80,12 C77,10 75,6 80,0 Z" fill="#ff416c"/>
    <rect x="30" y="50" width="100" height="35" rx="6" fill="url(#cyan_grad)"/>
    <rect x="15" y="85" width="130" height="45" rx="8" fill="url(#party_grad)"/>
    <rect x="0" y="130" width="160" height="55" rx="10" fill="#a855f7"/>
  </g>

  <!-- Text Content -->
  <text x="400" y="570" font-family="'Outfit', sans-serif" font-size="28" font-weight="700" fill="#00f2fe" letter-spacing="6" text-anchor="middle" filter="url(#neon_glow)">¡MI CUMPLEAÑOS!</text>
  <text x="400" y="660" font-family="'Outfit', sans-serif" font-size="72" font-weight="900" fill="#ffffff" text-anchor="middle">JUAN 18</text>
  <text x="400" y="720" font-family="'Montserrat', sans-serif" font-size="22" fill="#cbd5e1" text-anchor="middle">¡La fiesta del año está por comenzar!</text>

  <!-- Glowing CTA Badge -->
  <rect x="250" y="780" width="300" height="64" rx="32" fill="url(#party_grad)" filter="url(#neon_glow)"/>
  <text x="400" y="820" font-family="'Outfit', sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">¡NO PUEDES FALTAR!</text>
</svg>
