<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_cumple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="party_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff416c"/>
      <stop offset="100%" stop-color="#ff4b2b"/>
    </linearGradient>
    <linearGradient id="cyan_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bg_cumple)"/>

  <!-- Confetti Elements -->
  <g opacity="0.7">
    <circle cx="150" cy="180" r="12" fill="#ff416c"/>
    <circle cx="680" cy="220" r="18" fill="#00f2fe"/>
    <circle cx="220" cy="780" r="10" fill="#ffb703"/>
    <circle cx="620" cy="740" r="14" fill="#a855f7"/>

    <rect x="250" y="140" width="15" height="15" fill="#ffb703" transform="rotate(25 250 140)"/>
    <rect x="550" y="160" width="20" height="20" fill="#ff416c" transform="rotate(45 550 160)"/>
    <rect x="180" y="650" width="16" height="16" fill="#00f2fe" transform="rotate(15 180 650)"/>
    <rect x="650" y="620" width="18" height="18" fill="#ffb703" transform="rotate(60 650 620)"/>
  </g>

  <!-- Cake Icon Container -->
  <circle cx="400" cy="380" r="160" fill="#ffffff" opacity="0.05"/>
  <circle cx="400" cy="380" r="140" fill="none" stroke="url(#cyan_grad)" stroke-width="3" stroke-dasharray="10,5"/>

  <!-- Birthday Cake Icon -->
  <g transform="translate(320, 290)">
    <!-- Candle -->
    <rect x="72" y="10" width="16" height="40" rx="4" fill="#ffb703"/>
    <path d="M80,0 C85,6 83,10 80,12 C77,10 75,6 80,0 Z" fill="#ff416c"/>
    <!-- Layers -->
    <rect x="30" y="50" width="100" height="35" rx="6" fill="url(#cyan_grad)"/>
    <rect x="15" y="85" width="130" height="45" rx="8" fill="url(#party_grad)"/>
    <rect x="0" y="130" width="160" height="55" rx="10" fill="#a855f7"/>
  </g>

  <!-- Text Content -->
  <text x="400" y="570" font-family="'Outfit', sans-serif" font-size="28" font-weight="600" fill="#00f2fe" letter-spacing="4" text-anchor="middle">¡MI CUMPLEAÑOS!</text>
  <text x="400" y="660" font-family="'Outfit', sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle">JUAN 18</text>
  <text x="400" y="720" font-family="'Montserrat', sans-serif" font-size="20" fill="#cbd5e1" text-anchor="middle">¡La fiesta del año está por comenzar!</text>

  <!-- Glowing Button Badge -->
  <rect x="250" y="780" width="300" height="60" rx="30" fill="url(#party_grad)"/>
  <text x="400" y="818" font-family="'Outfit', sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">¡TE ESPERO!</text>
</svg>
