<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_boda" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfcf8"/>
      <stop offset="50%" stop-color="#f4efe6"/>
      <stop offset="100%" stop-color="#e8dfce"/>
    </linearGradient>
    <linearGradient id="gold_boda" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c5a059"/>
      <stop offset="50%" stop-color="#ebd197"/>
      <stop offset="100%" stop-color="#997a3a"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d5a27"/>
      <stop offset="100%" stop-color="#183616"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bg_boda)"/>

  <!-- Gold Botanical Frame -->
  <g stroke="url(#gold_boda)" stroke-width="2" fill="none">
    <rect x="90" y="90" width="620" height="820" rx="16"/>
    <rect x="105" y="105" width="590" height="790" rx="10" stroke-dasharray="8,4"/>
  </g>

  <!-- Circular Arch with Leaves -->
  <circle cx="400" cy="400" r="230" fill="none" stroke="url(#gold_boda)" stroke-width="2.5"/>
  
  <!-- Botanical Branches -->
  <g fill="url(#emerald)" opacity="0.85">
    <path d="M190,300 C170,270 180,240 210,260 C230,270 220,300 190,300 Z"/>
    <path d="M175,330 C150,330 150,300 175,315 C190,325 185,340 175,330 Z"/>
    <path d="M590,500 C610,530 600,560 570,540 C550,530 560,500 590,500 Z"/>
    <path d="M610,480 C635,480 635,510 610,495 C595,485 600,470 610,480 Z"/>
  </g>

  <!-- Interlocking Rings -->
  <g fill="none" stroke="url(#gold_boda)" stroke-width="4.5">
    <circle cx="370" cy="350" r="38"/>
    <circle cx="430" cy="350" r="38"/>
  </g>
  <polygon points="370,305 374,313 382,313 375,318 378,326 370,321 362,326 365,318 358,313 366,313" fill="url(#gold_boda)"/>

  <!-- Typography -->
  <text x="400" y="520" font-family="'Cormorant Garamond', serif" font-size="58" font-weight="bold" fill="#332c23" text-anchor="middle">María &amp; Carlos</text>
  <text x="400" y="575" font-family="'Montserrat', sans-serif" font-size="18" letter-spacing="8" font-weight="600" fill="#8c7443" text-anchor="middle">NUESTRA BODA</text>
  <text x="400" y="620" font-family="'Cormorant Garamond', serif" font-style="italic" font-size="24" fill="#665b4e" text-anchor="middle">"Juntos por el camino de la vida"</text>

  <!-- Date Ribbon -->
  <rect x="280" y="690" width="240" height="54" rx="27" fill="#ffffff" stroke="url(#gold_boda)" stroke-width="1.5"/>
  <text x="400" y="724" font-family="'Montserrat', sans-serif" font-size="16" font-weight="700" fill="#332c23" text-anchor="middle">18 OCTUBRE 2026</text>
</svg>
