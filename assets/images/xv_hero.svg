<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f7"/>
      <stop offset="50%" stop-color="#fde2e4"/>
      <stop offset="100%" stop-color="#fad2e1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#fff2a3"/>
      <stop offset="100%" stop-color="#aa771c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="350" fill="url(#glow)"/>

  <!-- Decorative Ornaments -->
  <g stroke="url(#gold)" stroke-width="2" fill="none">
    <circle cx="400" cy="400" r="320"/>
    <circle cx="400" cy="400" r="310" stroke-dasharray="6,6"/>
    <rect x="120" y="120" width="560" height="760" rx="20"/>
    <rect x="135" y="135" width="530" height="730" rx="15" stroke-opacity="0.5"/>
  </g>

  <!-- Crown Icon -->
  <path d="M350,310 L370,335 L400,285 L430,335 L450,310 L440,360 L360,360 Z" fill="url(#gold)"/>
  <circle cx="350" cy="303" r="5" fill="url(#gold)"/>
  <circle cx="400" cy="278" r="6" fill="url(#gold)"/>
  <circle cx="450" cy="303" r="5" fill="url(#gold)"/>

  <!-- Silhouette / Portrait Representation -->
  <circle cx="400" cy="450" r="80" fill="#e8b4b8" opacity="0.6"/>
  <path d="M320,590 C320,500 480,500 480,590 Z" fill="#e8b4b8" opacity="0.6"/>
  <circle cx="400" cy="430" r="65" fill="#f8edeb"/>
  
  <!-- Stylized Hair & Crown -->
  <path d="M340,430 Q400,360 460,430 Q440,480 400,470 Q360,480 340,430 Z" fill="#b5838d"/>

  <!-- Text Placeholder -->
  <text x="400" y="660" font-family="'Playfair Display', serif, sans-serif" font-size="42" font-weight="bold" fill="#6d597a" text-anchor="middle">Ana María</text>
  <text x="400" y="710" font-family="'Montserrat', sans-serif" font-size="20" letter-spacing="4" fill="#b5838d" text-anchor="middle">MIS XV AÑOS</text>

  <!-- Sparkles -->
  <g fill="url(#gold)">
    <path d="M220,220 L225,235 L240,240 L225,245 L220,260 L215,245 L200,240 L215,235 Z"/>
    <path d="M580,250 L583,260 L593,263 L583,266 L580,276 L577,266 L567,263 L577,260 Z"/>
    <path d="M250,750 L253,760 L263,763 L253,766 L250,776 L247,766 L237,763 L247,760 Z"/>
    <path d="M560,720 L565,735 L580,740 L565,745 L560,760 L555,745 L540,740 L555,735 Z"/>
  </g>
</svg>
